name: CI

on:
  push:
    branches: [main, fix/catalogue-restore]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: victoria_fish
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: victoria_fish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victoria_fish"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_SSL: disable
      CLIENT_URL: https://nyakundi-victoriafresh.vercel.app
      CORS_ALLOWED_ORIGINS: https://nyakundi-victoriafresh.vercel.app
      DATABASE_URL: postgresql://victoria_fish:ci-throwaway-password@127.0.0.1:5432/victoria_fish_test
      TEST_DATABASE_URL: postgresql://victoria_fish:ci-throwaway-password@127.0.0.1:5432/victoria_fish_test
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - run: npm run test:backend
      - run: npm run test:cart
