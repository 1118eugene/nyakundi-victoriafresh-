services:
  - type: web
    name: nyakundi-victoriafresh-2
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: victoria_fish
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_DASHBOARD_KEY
        sync: false
      - key: MPESA_BASE_URL
        value: https://api.safaricom.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline

  - type: static_site
    name: victoria-fresh-fish-storefront
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nyakundi-victoriafresh-2.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
