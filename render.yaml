services:
  - type: web
    name: nyakundi-victoriafresh-2
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: verify
      - key: CLIENT_URL
        value: https://nyakundi-victoriafresh.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://nyakundi-victoriafresh.vercel.app
      - key: ADMIN_DASHBOARD_KEY
        sync: false
      - key: DELIVERY_STAFF_ID
        sync: false
      - key: DELIVERY_STAFF_NAME
        sync: false
      - key: DELIVERY_STAFF_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: MPESA_BASE_URL
        value: https://api.safaricom.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_PROVIDER
        value: africastalking
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_EMAIL_FROM
        sync: false
      - key: FULIZA_CLIENT_ID
        sync: false
      - key: FULIZA_API_KEY
        sync: false
      - key: FULIZA_BASE_URL
        sync: false

  - type: static_site
    name: victoria-fresh-fish-storefront
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nyakundi-victoriafresh-2.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
